- name: Render Control Plane configuration template
  ansible.builtin.template:
    src: openstack_control_plane_pci_passthrough.yml.jinja2
    dest: "{{ artifacts_dir }}/openstack_control_plane_pci_passthrough.yml"
    mode: "0644"

- name: Apply Control Plane configuration
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  cifmw.general.ci_script:
    output_dir: "{{ artifacts_dir }}/artifacts"
    script: >-
      oc apply -n {{ namespace }} -f {{ artifacts_dir }}/openstack_control_plane_pci_passthrough.yml

- name: Render Control Plane configmap
  ansible.builtin.template:
    src: passthrough_config_map.yml.jinja2
    dest: "{{ artifacts_dir }}/passthrough_config_map.yml"
    mode: "0644"

- name: Create PC passthrough config map
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  cifmw.general.ci_script:
    output_dir: "{{ artifacts_dir }}/artifacts"
    script: >-
      oc apply -n {{ namespace }} -f {{ artifacts_dir }}/passthrough_config_map.yml

- name: Enable IOMMU
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  cifmw.general.ci_script:
    output_dir: "{{ artifacts_dir }}/artifacts"
    script: >-
      oc patch -n {{ namespace }} osdpns/"{{ iommu_dataplane_nodeset }}" --type=merge -p '{"spec": {"nodeTemplate": {"ansible": {"ansibleVars": {"edpm_kernel_iommu": true }}}}}'
  when: "enable_iommu"

- name: Set passthrough for flavor
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  cifmw.general.ci_script:
    output_dir: "{{ artifacts_dir }}/artifacts"
    script: |
      oc project {{ namespace }}
      oc rsh openstackclient \
      openstack flavor create {{ pci_passthrough_flavor_name }} \
      --property pci_passthrough:alias={{ pci_device_name }}

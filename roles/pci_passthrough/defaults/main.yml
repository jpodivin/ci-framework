# All variables intended for modification should be placed in this file.
# All variables within this role should have a prefix of "cifmw_pci_passthrough"

pci_vendor_id: ""
pci_product_id: ""
pci_device_name: ""

# One of 'type-PF', 'type-VF' or 'type-PCI'
pci_device_type: "type-PCI"

# One of 'requiered', 'legacy', 'preferred' or 'socket'
pci_numa_policy: "legacy"

enable_iommu: true

pci_passthrough_flavor_name: "pci-passthrough-flavor"
